<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Арена искр</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#150a42"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
<style>
/* Layout: one full-screen canvas draws loading, lobby, arena and result scenes; HTML overlays carry buttons, panels (shop, glory path, profile) and text. */
:root{
  --ink:#171033;
  --panel:#2a1b5e;
  --panel2:#3a2780;
  --edge:#4a3a8f;
  --lime:#b6f23a;
  --limed:#5c9a00;
  --hot:#ff6a2b;
  --sky:#35d0ff;
  --gold:#ffd23a;
  --pink:#ff4f7a;
  --text:#fff8e6;
  --muted:#b8a9ee;
  --font:"Russo One","Arial Black",Impact,sans-serif;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--ink);color:var(--text);font-family:var(--font);touch-action:none;user-select:none;-webkit-user-select:none}
canvas#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#probe{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.scr{position:fixed;inset:0;display:flex;flex-direction:column;pointer-events:none;padding:calc(max(10px,env(safe-area-inset-top,0px))) max(14px,env(safe-area-inset-right,0px)) calc(max(14px,env(safe-area-inset-bottom,0px))) max(14px,env(safe-area-inset-left,0px))}
#desk{position:fixed;inset:0;z-index:999;display:none;align-items:center;justify-content:center;background:#150a42;color:#fff8e6;text-align:center;padding:24px}
.dk{display:flex;flex-direction:column;gap:12px;align-items:center;max-width:420px}
.dk b{font-weight:400;font-size:28px;color:var(--gold)}.dk span{font-family:var(--ui);font-size:16px;color:var(--muted)}
.dki{font-size:64px;animation:bump 1.6s infinite}
@media (min-width:600px) and (hover:hover) and (pointer:fine),(orientation:landscape) and (max-height:520px){#desk{display:flex}}
.scr[hidden],.sheet[hidden],.panel[hidden],.modal[hidden]{display:none}
.scr button,.scr .hit{pointer-events:auto}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
svg{display:block}

/* lobby top */
.top{display:flex;align-items:center;gap:8px;animation:dropIn .5s cubic-bezier(.2,1.3,.4,1) both}
.prof{display:flex;align-items:center;gap:8px;background:rgba(12,7,32,.75);border:3px solid #0c0720;border-radius:16px;padding:3px 12px 3px 3px;min-width:0;flex:1 1 0;text-align:left;transition:transform .12s}
.prof:active{transform:scale(.96)}
.prof canvas{width:44px;height:44px;border-radius:12px;flex:none;border:2px solid #0c0720;background:#2a1b5e}
.prof .pn{min-width:0}
.prof b{display:block;font-weight:400;font-size:16px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prof .pt{display:flex;align-items:center;gap:4px;font-size:14px;color:var(--gold);line-height:1.1}
.prof .pt svg{width:16px;height:16px}
.cur{display:flex;gap:6px;flex:none}
.cp{display:flex;align-items:center;gap:5px;background:rgba(12,7,32,.75);border:3px solid #0c0720;border-radius:999px;padding:3px 11px 3px 4px;font-size:16px;color:var(--text);min-height:42px}
.cp svg{width:26px;height:26px;flex:none}
.cp.bump{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.2)}}
.title{text-align:center;font-size:clamp(22px,6vw,32px);color:var(--lime);text-shadow:0 3px 0 #3a7a00,0 6px 0 #0c0720;margin-top:8px;line-height:1;animation:dropIn .6s .1s cubic-bezier(.2,1.3,.4,1) both}
#stage{flex:1;min-height:110px}
.plate{text-align:center;margin-bottom:8px;animation:riseIn .5s .25s both}
.plate .nm{font-size:clamp(26px,7.5vw,38px);line-height:1;text-shadow:0 3px 0 #0c0720;-webkit-text-stroke:1px #0c0720}
.topnm{margin:6px 0 0;margin-bottom:0}
.plate .ds{display:none;font-family:var(--ui);font-size:13px;color:var(--muted);margin-top:3px}
.nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-bottom:8px}
.nb{position:relative;background:linear-gradient(180deg,#4a3a9a,#2e2370);border:3px solid #0c0720;border-bottom-width:6px;border-radius:14px;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;animation:riseIn .5s both;transition:transform .1s}
.nb:nth-child(1){animation-delay:.3s}.nb:nth-child(2){animation-delay:.36s}.nb:nth-child(3){animation-delay:.42s}.nb:nth-child(4){animation-delay:.48s}.nb:nth-child(5){animation-delay:.54s}
.nb svg{width:28px;height:28px}
.nb.hot{background:linear-gradient(180deg,#ffe45a,#f5b21a);animation:riseIn .5s both,hotp 1.2s ease-in-out .8s infinite}
.nb.hot .nt{color:#2a1a00;font-weight:700}.nb.hot.gift .nt{color:#0a8a2e;text-shadow:0 1px 0 rgba(255,255,255,.5)}
@keyframes hotp{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.nb:active,.side:active,.play:active{transform:translateY(4px);border-bottom-width:3px}
.dot{position:absolute;top:-8px;right:-5px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:#ff3d5a;border:2px solid #0c0720;font-size:12px;display:flex;align-items:center;justify-content:center;animation:dotp 1.1s ease-in-out infinite}
.dot[hidden]{display:none}
@keyframes dotp{50%{transform:scale(1.22)}}
.bar{display:flex;align-items:stretch;gap:10px;animation:riseIn .5s .55s both}
.side{flex:1 1 0;min-width:0;background:var(--panel);border:3px solid #0c0720;border-bottom-width:7px;border-radius:16px;padding:8px 8px 6px;font-size:18px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;min-height:68px}
.side small{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.side span{font-size:16px;line-height:1.1}
.play{flex:1.6 1 0;min-width:0;background:var(--lime);color:#183300;border:3px solid #0c0720;border-bottom-width:8px;border-radius:18px;font-size:clamp(28px,8vw,38px);letter-spacing:.03em;min-height:68px;animation:pulse 1.6s ease-in-out infinite;position:relative;overflow:hidden}
.play::after{content:"";position:absolute;top:0;bottom:0;width:36%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);animation:shine 3.2s ease-in-out infinite}
@keyframes shine{0%,55%{transform:translateX(0)}100%{transform:translateX(480%)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes dropIn{from{opacity:0;transform:translateY(-40px)}to{opacity:1;transform:none}}
@keyframes riseIn{from{opacity:0;transform:translateY(50px)}to{opacity:1;transform:none}}
@keyframes popIn{0%{opacity:0;transform:scale(.6)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}

/* rarity */
.rrow{display:flex;justify-content:center;align-items:center;gap:8px;margin-bottom:4px}
.rib{font-family:var(--ui);font-weight:700;font-size:12px;color:#1a0f2e;padding:2px 12px;border-radius:4px 10px 4px 10px;border:2px solid #0c0720;letter-spacing:.3px}
.rib.r5{background:linear-gradient(100deg,#ffd23a,#fff3a0,#ffd23a)!important;background-size:200% 100%;animation:shimm 2.4s linear infinite;box-shadow:0 0 14px rgba(255,210,58,.7)}
.lvp{font-size:12px;background:#0c0720;color:var(--gold);padding:2px 9px;border-radius:9px;border:2px solid #3a2f70}
.rrarT{font-family:var(--ui);font-size:13px;margin-left:6px}
.card .rarb{display:block;font-size:10px;font-family:var(--ui);font-weight:700;margin-top:1px}
.pshow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.psc{background:rgba(12,7,32,.55);border:3px solid #b8860b;border-radius:16px;padding:4px 4px 8px;text-align:center;font-size:14px}
.psc canvas{width:100%;max-width:130px;aspect-ratio:130/150;display:block;margin:0 auto}
.psc b{display:block;font-weight:400}
.psc small{display:block;font-family:var(--ui);font-size:11px;color:var(--gold);margin-top:2px}
@keyframes shimm{from{background-position:0 0}to{background-position:200% 0}}
/* roster sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:80%;overflow-y:auto;display:flex;flex-direction:column;background:#1f1450;border-top:5px solid var(--lime);border-radius:22px 22px 0 0;transform:translateY(105%);transition:transform .38s cubic-bezier(.2,1.1,.3,1);padding:12px max(14px,env(safe-area-inset-right,0px)) calc(max(12px,env(safe-area-inset-bottom,0px))) max(14px,env(safe-area-inset-left,0px));touch-action:pan-y;z-index:5}
.sheet.open{transform:none}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
#roster[data-v=list] #bars,#roster[data-v=list] #rsup,#roster[data-v=list] #rup,#roster[data-v=list] .skh,#roster[data-v=list] #skrow{display:none}
#roster[data-v=det] #cards{display:none}
.card.sel{box-shadow:none}
.sh-head h3{margin:0;font-weight:400;font-size:22px}
.x{width:42px;height:42px;border-radius:12px;background:var(--panel);border:3px solid #0c0720;font-size:22px;line-height:1;flex:none;display:flex;align-items:center;justify-content:center}
.bars{display:grid;grid-template-columns:auto 1fr auto;gap:5px 10px;align-items:center;font-family:var(--ui);font-size:13px;color:var(--muted);margin:2px 0 8px}
.bar-t{height:10px;border-radius:5px;background:#0c0720;overflow:hidden}
.bar-t i{display:block;height:100%;border-radius:5px;background:var(--lime);transition:width .45s cubic-bezier(.2,1.2,.3,1)}
.sup{font-family:var(--ui);font-size:13px;color:var(--text);margin:0 0 8px;line-height:1.35}
.sup b{color:var(--gold)}
.skrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 10px}
.skh{font-size:14px;color:var(--gold);margin:4px 0 6px}
.skc{background:var(--panel);border:3px solid var(--edge);border-radius:14px;padding:4px 3px 6px;text-align:center;min-width:0;font-family:var(--ui);position:relative}
.skc canvas{width:100%;max-width:64px;aspect-ratio:64/72;display:block;margin:0 auto}
.skc b{display:block;font-size:12px;line-height:1.15;color:var(--text);min-height:28px}
.skc small{display:block;font-size:11px;margin-top:2px;color:var(--muted);line-height:1.2}
.skc.sel{border-color:var(--lime);background:var(--panel2)}.skc.sel small{color:var(--lime)}
.skc.lk canvas{filter:brightness(.45)}
.skc .rt{position:absolute;top:3px;left:3px;font-size:9px;padding:0 5px;border-radius:6px;color:#1a0f2e;border:1.5px solid #0c0720}
.bars .bv{color:var(--text);min-width:46px;text-align:right}
.seasonrow{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin-bottom:8px;align-items:center}
.seasonrow .tm{background:#0c0720;border-radius:999px;padding:3px 11px;font-size:13px;color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips span{font-family:var(--ui);font-size:12px;background:#0c0720;border-radius:8px;padding:3px 9px;color:var(--muted)}
.chips span b{color:var(--text);font-weight:700}
.nxt{font-family:var(--ui);font-size:13px;margin-top:8px;color:var(--text)}.nxt b{color:var(--gold)}
.pmid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.pmid small{font-family:var(--ui);font-size:10px;color:var(--muted)}
.prow.mile .pnum{width:44px;height:44px;box-shadow:0 0 0 3px rgba(255,210,58,.45)}
.mlab{position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:10px;font-family:var(--ui);font-weight:700;background:var(--gold);color:#3a2400;border:2px solid #0c0720;border-radius:8px;padding:0 7px;white-space:nowrap}
.prow{position:relative}
.tier .pgm{height:7px;border-radius:4px;background:#0c0720;overflow:hidden;margin-top:5px}.tier .pgm i{display:block;height:100%;background:linear-gradient(90deg,#ff9a2f,#ffd23a)}
.tier .tg{display:inline-block;font-family:var(--ui);font-size:10px;font-weight:700;padding:0 6px;border-radius:6px;margin-left:6px;vertical-align:middle;color:#1a0f2e;background:#9fb4e0}
.tier.mile{border-color:#b8860b}
.plate .nm{display:inline-block;padding:0 14px 5px;border-bottom:4px solid var(--rc,#fff);box-shadow:0 9px 14px -11px var(--rc,#fff)}
#rname{display:inline-block;border-bottom:4px solid var(--rc,#fff);padding-bottom:1px}
.skb{font-family:var(--ui);font-size:13px;font-weight:600;padding:7px 12px;border-radius:10px;background:var(--panel);border:2px solid var(--edge);color:var(--muted);min-height:36px}
.skb.sel{background:var(--lime);color:#183300;border-color:var(--limed)}
.cards{flex:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;overflow-y:auto;padding:4px 2px 4px;touch-action:pan-y}
.card{background:var(--panel);border:3px solid var(--edge);border-radius:14px;padding:6px 4px 8px;text-align:center;position:relative;min-width:0}
.card canvas{width:100%;max-width:96px;aspect-ratio:96/104;display:block;margin:0 auto}
.card .cn{font-size:15px;display:block}
.card.sel{border-color:var(--lime);background:var(--panel2);animation:popIn .3s both}
.card.lock{opacity:.7;border-style:dashed}
.card.lock canvas{filter:brightness(.25) contrast(1.2)}
.card .lk{position:absolute;left:0;right:0;top:34%;font-size:12px;color:var(--gold);padding:0 4px;line-height:1.2}
.card .lvc{position:absolute;top:4px;left:4px;font-style:normal;font-size:11px;background:var(--gold);color:#3a2400;border-radius:7px;padding:1px 6px;border:2px solid #0c0720}
.card .upd{position:absolute;top:4px;right:6px;font-style:normal;font-size:13px;color:var(--lime);text-shadow:0 1px 2px #000}
.card .pg{height:6px;background:#0c0720;border-radius:3px;margin:5px 8px 0;overflow:hidden}
.card .pg i{display:block;height:100%;background:var(--gold)}

/* power level */
.rup{background:var(--panel);border:3px solid var(--edge);border-radius:14px;padding:9px 10px;margin:0 0 8px;font-family:var(--ui)}
.lvr{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.lvb{font-family:'Russo One',sans-serif;font-size:15px;background:var(--gold);color:#3a2400;border-radius:9px;padding:3px 9px;border:2px solid #0c0720;white-space:nowrap}
.lvr small{flex:1;color:var(--muted);font-size:12px;text-align:right}
.ppb{position:relative;height:18px;border-radius:9px;background:#0c0720;overflow:hidden;margin-bottom:8px}
.ppb i{display:block;height:100%;background:linear-gradient(90deg,#ff9a2b,#ffd23a);border-radius:9px;transition:width .5s cubic-bezier(.2,1.2,.3,1)}
.ppb span{position:absolute;inset:0;text-align:center;font-size:12px;line-height:18px;font-weight:700;color:#fff;text-shadow:0 1px 2px #000}
.upb{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:44px;border-radius:12px;background:var(--lime);border:3px solid #0c0720;border-bottom-width:6px;color:#183300;font-family:'Russo One',sans-serif;font-size:16px}
.upb svg{width:22px;height:22px}
.upb.off{background:#4b4580;color:#b9b3e8}
.upb:active{transform:translateY(2px)}
.abl{display:flex;gap:10px;align-items:center;padding:7px 0 0;font-size:13px;line-height:1.3;color:var(--text)}
.abl b{color:var(--gold);display:block}
.abl.lk{opacity:.55}
.abl .ai{flex:none;width:38px;height:38px;border-radius:11px;border:2px solid #0c0720;display:flex;align-items:center;justify-content:center;font-size:19px}
.abl .ai.g{background:#2a8fd9}.abl .ai.p{background:#d9406a}
.abl em{font-style:normal;color:#ffb347;font-size:12px}
.upb.pop{animation:popIn .35s both}
/* brawl-pass style track */
.pgold{display:flex;align-items:center;gap:10px;background:linear-gradient(100deg,#7a4d00,#d99a14 55%,#ffd23a);border:3px solid #0c0720;border-radius:18px;padding:10px 12px;margin-bottom:12px;color:#2a1800}
.pgold b{display:block;font-size:18px;color:#fff8e6;text-shadow:0 2px 0 #5a3500}
.pgold small{display:block;font-family:var(--ui);font-size:12px;color:#3a2400;line-height:1.25}
.pgold .buy{flex:none;width:auto;padding:0 14px}
.phd{display:grid;grid-template-columns:1fr 38px 1fr;gap:6px;margin:0 0 6px;font-size:13px;text-align:center;color:var(--muted)}
.phd .g{color:var(--gold)}
.prow{display:grid;grid-template-columns:1fr 38px 1fr;gap:6px;align-items:stretch;margin-bottom:8px;animation:riseIn .4s both}
.pnum{align-self:center;width:38px;height:38px;border-radius:50%;background:#0c0720;color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:16px;border:3px solid #3a2f70}
.pnum.ok{background:var(--gold);color:#3a2a00;border-color:#fff3a8}
.pcell{background:var(--panel);border:3px solid #0c0720;border-radius:14px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;min-height:104px;font-family:var(--ui);font-size:12px;line-height:1.2;position:relative;min-width:0}
.pcell canvas{width:50px;height:50px}
.pcell.gold{background:linear-gradient(180deg,#5a3d00,#2a1c00);border-color:#b8860b}
.pcell.lockd canvas,.pcell.lockd span{opacity:.55}
.pcell.claim{box-shadow:0 0 0 3px var(--gold)}
.pcell .buy{min-height:30px;font-size:13px;padding:0 10px;width:auto}
.pcell .tk{color:var(--lime);font-size:12px}
.pcell .lkI{position:absolute;top:4px;right:6px;font-size:13px}
/* panels */
.panel{position:fixed;inset:0;display:flex;flex-direction:column;background:radial-gradient(120% 60% at 50% 0,#3a1f86 0,#1b1050 55%,#120a34 100%);z-index:6;transform:translateY(100%);opacity:.4;transition:transform .38s cubic-bezier(.2,1,.3,1),opacity .3s;padding:max(8px,env(safe-area-inset-top,0px)) 0 0 0;touch-action:pan-y}
.panel.on{transform:none;opacity:1}
.ph{display:flex;align-items:center;gap:8px;padding:6px max(14px,env(safe-area-inset-right,0px)) 8px max(14px,env(safe-area-inset-left,0px))}
.ph h2{flex:1;margin:0;font-weight:400;font-size:26px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph .cp{min-height:36px;font-size:14px;padding:2px 9px 2px 3px}
.ph .cp svg{width:22px;height:22px}
.pb{flex:1;overflow-y:auto;padding:4px max(14px,env(safe-area-inset-right,0px)) calc(max(22px,env(safe-area-inset-bottom,0px))) max(14px,env(safe-area-inset-left,0px));touch-action:pan-y;-webkit-overflow-scrolling:touch}
.sec{font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 8px;display:flex;align-items:center;gap:8px}
.sec::after{content:"";flex:1;height:2px;background:rgba(184,169,238,.25)}
.sec:first-child{margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:var(--panel);border:3px solid #0c0720;border-radius:16px;padding:8px;text-align:center;position:relative;min-width:0;animation:popIn .4s both}
.tile.own{border-color:var(--limed)}
.tile.eq{border-color:var(--lime);background:var(--panel2)}
.tile canvas{width:100%;aspect-ratio:1/1;display:block;max-width:130px;margin:0 auto}
.tile .tn{font-size:15px;line-height:1.15;display:block;margin:2px 0}
.tile .ts{font-family:var(--ui);font-size:12px;color:var(--muted);display:block;margin-bottom:6px}

    for(k=0;k<n;k++){put(x+(rr()<.5?k:0),y+(rr()<.5?0:k),1);if(rr()<.35)put(x+1,y+1,1)}}

    for(var ox=-2;ox<=2;ox++)for(var oy=-2;oy<=2;oy++)if(ox*ox+oy*oy<=3+rr()*1.5)put(lx+ox,ly+oy,4)}
  for(c=0;c<12;c++)put(1+Math.floor(rr()*8),2+Math.floor(rr()*15),3);
  for(var yy=0;yy<GW;yy++)for(var xx=0;xx<GW/2;xx++)map[yy*GW+(GW-1-xx)]=map[yy*GW+xx];

    for(var dx=-1;dx<=1;dx++)for(var dy=-1;dy<=1;dy++){var X=sx+dx,Y=sy+dy;if(X>0&&Y>0&&X<GW-1&&Y<GW-1)map[Y*GW+X]=0}}

function loop(now){
  var dt=Math.min(.05,(now-last)/1000);last=now;uiT+=dt;
  ctx=mainCtx;ctx.setTransform(DPR,0,0,DPR,0,0);
  if(state==="loading")drawLoading(dt);
  else if(state==="lobby"){
    if(lob.hasLook&&uiT-lob.lookAt>5)lob.hasLook=false;
    if(!panel){ctx.setTransform(DPR,0,0,DPR,0,0);drawLobby(dt)}
    tweenCur(dt);
    if(lob.rosterOpen||panel)drawLive();
    drawChestAnim(dt);
    ctx=mainCtx;
  }
  else if(state==="intro"||state==="play"||state==="end"||state==="pause"){
    if(state==="intro"||state==="play"||state==="end")update(dt);
    ctx.setTransform(DPR,0,0,DPR,0,0);drawGame();
  }
  else if(state==="result"){
    var sh=shake?(Math.random()-.5)*shake:0;ctx.save();ctx.translate(sh,sh);drawResult(dt);ctx.restore();
  }
  ctx=mainCtx;ctx.setTransform(DPR,0,0,DPR,0,0);
  updateWipe(dt);drawWipe();
  requestAnimationFrame(loop);
}
